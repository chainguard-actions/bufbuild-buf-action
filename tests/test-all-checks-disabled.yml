name: Test with all optional checks disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Copy proto fixtures into workspace
        run: |
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/proto" "$GITHUB_WORKSPACE/proto"
      - id: action
        uses: .
        with:
          setup_only: "false"
          input: "proto"
          lint: "false"
          format: "false"
          breaking: "false"
          push: "false"
          archive: "false"
      - name: Assert buf_version output is set
        env:
          BUF_VERSION: ${{ steps.action.outputs.buf_version }}
        run: |
          echo "buf_version: $BUF_VERSION"
          if [ -z "$BUF_VERSION" ]; then
            echo "FAIL: buf_version output is empty"
            exit 1
          fi
          echo "PASS: buf_version is '$BUF_VERSION'"
      - name: Assert buf_path output is set
        env:
          BUF_PATH: ${{ steps.action.outputs.buf_path }}
        run: |
          echo "buf_path: $BUF_PATH"
          if [ -z "$BUF_PATH" ]; then
            echo "FAIL: buf_path output is empty"
            exit 1
          fi
          echo "PASS: buf_path is '$BUF_PATH'"
