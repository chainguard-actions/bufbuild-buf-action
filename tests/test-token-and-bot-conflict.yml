name: Test token and bot_username together are rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: 1.50.0
          token: not-a-real-bsr-token
          bot_username: example-bot
          setup_only: "true"
      - name: Assert failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOKEN_OUT: ${{ steps.action.outputs.token }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when both token and bot_username are set"
            exit 1
          fi
          if [ -n "$TOKEN_OUT" ]; then
            echo "FAIL: no token should be minted"
            exit 1
          fi
          echo "PASS"
