name: Test error when both token and bot_username are set
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: "fake-buf-token-for-testing"
          bot_username: "some-bot-user"
          setup_only: "true"
          lint: "false"
          format: "false"
          breaking: "false"
          push: "false"
          archive: "false"
      - name: Assert action failed due to conflicting auth inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when both token and bot_username are set"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when both token and bot_username are set"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
