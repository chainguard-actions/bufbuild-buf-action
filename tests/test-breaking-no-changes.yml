name: Test breaking change detection with no changes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Copy proto fixtures into workspace
        run: |
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/proto" "$GITHUB_WORKSPACE/proto"
      - name: Get current commit SHA for breaking_against
        id: sha
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Current SHA: $SHA"
      - id: action
        uses: .
        with:
          setup_only: "false"
          input: "proto"
          lint: "false"
          format: "false"
          breaking: "true"
          breaking_against: "proto#format=dir"
          push: "false"
          archive: "false"
      - name: Assert action succeeded (no breaking changes)
        env:
          BUF_VERSION: ${{ steps.action.outputs.buf_version }}
        run: |
          echo "buf_version: $BUF_VERSION"
          if [ -z "$BUF_VERSION" ]; then
            echo "FAIL: buf_version output is empty"
            exit 1
          fi
          echo "PASS: breaking change detection completed with no changes"
