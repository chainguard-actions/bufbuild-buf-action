name: Test push with breaking change detection inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          breaking_against: "."
          breaking_against_registry: "false"
          push_create_visibility: "private"
          push_disable_create: "false"
          lint: "false"
          format: "false"
          breaking: "false"
          push: "false"
          archive: "false"
          setup_only: "true"
      - name: Assert buf_path output is set
        env:
          BUF_PATH: ${{ steps.action.outputs.buf_path }}
        run: |
          echo "buf_path: $BUF_PATH"
          if [ -z "$BUF_PATH" ]; then
            echo "FAIL: buf_path output is empty"
            exit 1
          fi
          echo "PASS"
