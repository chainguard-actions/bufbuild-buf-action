name: Test buf-action setup with version checksum verification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: buf
        uses: .
        continue-on-error: true
        with:
          setup_only: "true"
          version: "1.50.1"
          checksum: "invalid-checksum-to-test-input-is-accepted"
      - name: Assert action ran (checksum mismatch causes graceful failure)
        env:
          OUTCOME: ${{ steps.buf.outcome }}
          BUF_VERSION: ${{ steps.buf.outputs.buf_version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "buf_version: $BUF_VERSION"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully on checksum mismatch (expected)"
          elif [ "$OUTCOME" = "success" ]; then
            if [ -z "$BUF_VERSION" ]; then
              echo "FAIL: action succeeded but buf_version output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with buf_version=$BUF_VERSION"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
