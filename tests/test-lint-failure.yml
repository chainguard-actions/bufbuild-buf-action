name: Test lint failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: 1.50.0
          input: tests/fixtures/badlint
          lint: "true"
          format: "false"
          breaking: "false"
          push: "false"
          pr_comment: "false"
      - name: Assert action failed due to lint
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.buf_version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "buf_version: $VERSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure from lint violations"
            exit 1
          fi
          if [ "$VERSION" != "1.50.0" ]; then
            echo "FAIL: buf_version output should still be set"
            exit 1
          fi
          echo "PASS"
