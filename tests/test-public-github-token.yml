name: Test setup with public_github_token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          public_github_token: ${{ github.token }}
          setup_only: "true"
          lint: "false"
          format: "false"
          breaking: "false"
          push: "false"
          archive: "false"
      - name: Assert buf_version output is set
        env:
          BUF_VERSION: ${{ steps.action.outputs.buf_version }}
        run: |
          echo "buf_version: $BUF_VERSION"
          if [ -z "$BUF_VERSION" ]; then
            echo "FAIL: buf_version output is empty, action may have failed"
            exit 1
          fi
          echo "PASS: setup with public_github_token completed, buf_version is '$BUF_VERSION'"
      - name: Assert buf binary is available on PATH
        run: |
          if ! command -v buf > /dev/null 2>&1; then
            echo "FAIL: buf binary not found on PATH"
            exit 1
          fi
          BUF_VER=$(buf --version)
          echo "buf version on PATH: $BUF_VER"
          echo "PASS: buf is available on PATH"
