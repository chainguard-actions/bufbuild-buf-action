name: Test setup_only with latest version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          setup_only: "true"
      - name: Assert a semver version was resolved and installed
        env:
          VERSION: ${{ steps.action.outputs.buf_version }}
          BUF_PATH: ${{ steps.action.outputs.buf_path }}
        run: |
          echo "buf_version: $VERSION"
          echo "buf_path: $BUF_PATH"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: buf_version is not a semver: '$VERSION'"
            exit 1
          fi
          ACTUAL="$("$BUF_PATH" --version)"
          echo "buf --version: $ACTUAL"
          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "FAIL: installed buf version does not match output"
            exit 1
          fi
          echo "PASS"
