name: Test PR lint and format with paths
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          input: "."
          paths: |
            proto
          exclude_paths: |
            proto/vendor
          exclude_imports: "false"
          lint: "false"
          format: "false"
          breaking: "false"
          push: "false"
          archive: "false"
          setup_only: "true"
          pr_comment: "false"
      - name: Assert buf_version output is set
        env:
          BUF_VERSION: ${{ steps.action.outputs.buf_version }}
        run: |
          echo "buf_version: $BUF_VERSION"
          if [ -z "$BUF_VERSION" ]; then
            echo "FAIL: buf_version output is empty"
            exit 1
          fi
          echo "PASS"
