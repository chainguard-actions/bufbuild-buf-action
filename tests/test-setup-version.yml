name: Test setup with explicit version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "1.47.2"
          setup_only: "true"
          lint: "false"
          format: "false"
          breaking: "false"
          push: "false"
          archive: "false"
      - name: Assert buf_version matches requested version
        env:
          BUF_VERSION: ${{ steps.action.outputs.buf_version }}
        run: |
          echo "buf_version: $BUF_VERSION"
          if [ "$BUF_VERSION" != "1.47.2" ]; then
            echo "FAIL: expected buf_version '1.47.2', got '$BUF_VERSION'"
            exit 1
          fi
          echo "PASS: buf_version matches requested version"
      - name: Assert buf binary reports correct version
        run: |
          ACTUAL=$(buf --version 2>&1)
          echo "buf --version: $ACTUAL"
          if [ "$ACTUAL" != "1.47.2" ]; then
            echo "FAIL: expected buf version '1.47.2', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: buf binary version matches"
