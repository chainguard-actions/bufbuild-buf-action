name: Test buf-action defaults under workflow_dispatch
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: buf
        uses: .
        with:
          # Under workflow_dispatch: lint=false, format=false, breaking=false,
          # push=false, archive=false. Use setup_only to avoid buf build running
          # on workspace root (which has no buf.yaml).
          setup_only: "true"
      - name: Assert action succeeded with defaults
        env:
          BUF_VERSION: ${{ steps.buf.outputs.buf_version }}
          BUF_PATH: ${{ steps.buf.outputs.buf_path }}
        run: |
          echo "buf_version: $BUF_VERSION"
          echo "buf_path: $BUF_PATH"
          if [ -z "$BUF_VERSION" ]; then
            echo "FAIL: buf_version output is empty"
            exit 1
          fi
          if [ -z "$BUF_PATH" ]; then
            echo "FAIL: buf_path output is empty"
            exit 1
          fi
          echo "PASS: action succeeded with defaults, buf_version=$BUF_VERSION"
