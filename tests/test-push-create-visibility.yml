name: Test push_create_visibility input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Copy proto fixtures into workspace
        run: |
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/proto" "$GITHUB_WORKSPACE/proto"
      - id: action
        uses: .
        with:
          setup_only: "false"
          input: "proto"
          lint: "false"
          format: "false"
          breaking: "false"
          push: "true"
          push_create_visibility: "private"
          push_disable_create: "false"
          archive: "false"
        continue-on-error: true
      - name: Assert action ran (push may fail without BSR token or valid BSR repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BUF_VERSION: ${{ steps.action.outputs.buf_version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "buf_version: $BUF_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$BUF_VERSION" ]; then
              echo "FAIL: action succeeded but buf_version output is empty"
              exit 1
            fi
            echo "PASS: push with push_create_visibility succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without BSR token/valid BSR repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
