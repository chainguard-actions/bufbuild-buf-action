name: Test buf-action lint with specific paths filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: buf
        uses: .
        with:
          setup_only: "false"
          lint: "true"
          format: "false"
          breaking: "false"
          push: "false"
          archive: "false"
          input: "${{ github.workspace }}/tests/fixtures/proto"
          paths: |
            acme/v1/hello.proto
      - name: Assert lint passed with paths filter
        env:
          BUF_VERSION: ${{ steps.buf.outputs.buf_version }}
        run: |
          echo "buf_version: $BUF_VERSION"
          if [ -z "$BUF_VERSION" ]; then
            echo "FAIL: buf_version output is empty"
            exit 1
          fi
          echo "PASS: lint with paths filter completed, buf_version=$BUF_VERSION"
