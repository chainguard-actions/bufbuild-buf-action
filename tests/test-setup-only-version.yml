name: Test setup_only with explicit version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 1.50.0
          setup_only: "true"
      - name: Assert outputs
        env:
          VERSION: ${{ steps.action.outputs.buf_version }}
          BUF_PATH: ${{ steps.action.outputs.buf_path }}
          TOKEN_OUT: ${{ steps.action.outputs.token }}
        run: |
          echo "buf_version: $VERSION"
          echo "buf_path: $BUF_PATH"
          if [ "$VERSION" != "1.50.0" ]; then
            echo "FAIL: expected buf_version 1.50.0"
            exit 1
          fi
          if [ -z "$BUF_PATH" ]; then
            echo "FAIL: buf_path is empty"
            exit 1
          fi
          if [ -n "$TOKEN_OUT" ]; then
            echo "FAIL: token output should be empty without bot_username"
            exit 1
          fi
          echo "PASS"
      - name: Assert buf is on PATH with correct version
        env:
          BUF_PATH: ${{ steps.action.outputs.buf_path }}
        run: |
          ACTUAL="$("$BUF_PATH" --version)"
          echo "buf --version: $ACTUAL"
          if [ "$ACTUAL" != "1.50.0" ]; then
            echo "FAIL: expected 1.50.0"
            exit 1
          fi
          echo "PASS"
