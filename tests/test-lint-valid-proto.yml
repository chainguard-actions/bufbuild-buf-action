name: Test lint with valid proto files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Copy proto fixtures into workspace
        run: |
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/proto" "$GITHUB_WORKSPACE/proto"
      - id: action
        uses: .
        with:
          setup_only: "false"
          input: "proto"
          lint: "true"
          format: "false"
          breaking: "false"
          push: "false"
          archive: "false"
      - name: Assert action succeeded (lint passed)
        env:
          BUF_VERSION: ${{ steps.action.outputs.buf_version }}
        run: |
          echo "buf_version: $BUF_VERSION"
          if [ -z "$BUF_VERSION" ]; then
            echo "FAIL: buf_version output is empty, action may have failed"
            exit 1
          fi
          echo "PASS: lint step completed successfully"
