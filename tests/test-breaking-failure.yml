name: Test breaking change detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: 1.50.0
          input: tests/fixtures/breaking
          lint: "false"
          format: "false"
          breaking: "true"
          breaking_against: tests/fixtures/good
          push: "false"
          pr_comment: "false"
      - name: Assert action failed due to breaking change
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure from deleted field"
            exit 1
          fi
          echo "PASS"
